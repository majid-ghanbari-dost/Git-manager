name: Windows CI
on:
  push:
    branches: [main, 'work/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/GitManager.App/GitManager.App.csproj
      - name: Build
        run: dotnet build src/GitManager.App/GitManager.App.csproj --configuration Release --no-restore
      - name: Run unit tests
        run: dotnet test tests/GitManager.Tests/GitManager.Tests.csproj --configuration Release
      - name: Publish portable folder
        run: dotnet publish src/GitManager.App/GitManager.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts/GitManager-win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: git-manager-win-x64
          path: artifacts/GitManager-win-x64/
          if-no-files-found: error
